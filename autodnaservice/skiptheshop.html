<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkipTheShop™ — AutoDNA Service</title>
  <meta name="description" content="A new format of car service — where you don’t go to the shop. Our technician picks up your car, completes all necessary work, and brings it back to you.">
  <link rel="icon" type="image/svg+xml" href="assets/img/site1/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/page-shop.css">
</head>
<body class="page-shop">

<!-- ══ FIXED HUD HEADER ══════════════════════════════════════════════════ -->
<!-- ══ FULLSCREEN MENU OVERLAY (EXACT FIGMA 464:3660 MATCH) ══════════════ -->
<main class="shop-main">

  <!-- ══ DESKTOP BOARD (100% Vector SVG from Figma Skip the Shop.svg, 1440x4376) ══ -->
  <div class="shop-board shop-board--desktop">
    <img src="assets/img/skiptheshop-desktop-clean.svg" class="shop-svg" alt="SkipTheShop™ — Your car goes to service. You don’t." fetchpriority="high">

    <!-- Interactive Top Button: Back to AutoDNA Service / Dropdown -->
    <a href="dnaservice.html#multiple-services" class="shop-hitarea shop-hitarea--top-btn" aria-label="Back to AutoDNA Service"></a>

    <!-- Interactive 2 Promise Cards Arrow Buttons [ ↗ ] -->
    <a href="#how-it-works" class="shop-hitarea shop-hitarea--promise-1" aria-label="Diagnostic live stream"></a>
    <a href="#how-it-works" class="shop-hitarea shop-hitarea--promise-2" aria-label="Partner car wash"></a>

    <!-- Interactive 5 Benefit Cards -->
    <div class="shop-hitarea shop-hitarea--benefit-1" tabindex="0" role="button" aria-label="No queues or trips"></div>
    <div class="shop-hitarea shop-hitarea--benefit-2" tabindex="0" role="button" aria-label="Professional service"></div>
    <div class="shop-hitarea shop-hitarea--benefit-3" tabindex="0" role="button" aria-label="Subscription option DriveCarePlan"></div>
    <div class="shop-hitarea shop-hitarea--benefit-4" tabindex="0" role="button" aria-label="Transparent communication"></div>
    <div class="shop-hitarea shop-hitarea--benefit-5" tabindex="0" role="button" aria-label="Convenient for busy people"></div>

    <!-- Interactive Footer Links -->
    <a href="tel:+14033128306" class="shop-hitarea shop-hitarea--phone" aria-label="Call +1 (403) 312-8306"></a>
    <a href="mailto:info@autodna.com" class="shop-hitarea shop-hitarea--email" aria-label="Email info@autodna.com"></a>

    <div class="shop-hitarea shop-hitarea--socials">
      <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook"></a>
      <a href="https://x.com" target="_blank" rel="noopener" aria-label="X (Twitter)"></a>
      <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram"></a>
    </div>

    <a href="https://maps.google.com/?q=730+2+Ave+SW+Calgary+T2P1R8+Canada" target="_blank" rel="noopener" class="shop-hitarea shop-hitarea--address" aria-label="Find us on Google Maps"></a>
  </div>

  <!-- ══ MOBILE BOARD (100% Vector SVG from Figma SkipTheDealer mob-1.svg, 393x4597) ══ -->
  <div class="shop-board shop-board--mobile">
    <img src="assets/img/skiptheshop-mobile-clean.svg" class="shop-svg" alt="SkipTheShop Mobile" fetchpriority="high">

    <!-- Interactive Mobile Hitareas -->
    <a href="dnaservice.html#multiple-services" class="shop-mob-hitarea shop-mob-hitarea--top-btn" aria-label="Back to AutoDNA Service"></a>
    <a href="#how-it-works-mob" class="shop-mob-hitarea shop-mob-hitarea--promise-1" aria-label="Live diagnostic stream"></a>
    <a href="#how-it-works-mob" class="shop-mob-hitarea shop-mob-hitarea--promise-2" aria-label="Partner car wash"></a>
    <a href="tel:+14033128306" class="shop-mob-hitarea shop-mob-hitarea--phone" aria-label="Call +1 (403) 312-8306"></a>
    <a href="mailto:info@autodna.com" class="shop-mob-hitarea shop-mob-hitarea--email" aria-label="Email info@autodna.com"></a>
    <a href="https://maps.google.com/?q=730+2+Ave+SW+Calgary+T2P1R8+Canada" target="_blank" rel="noopener" class="shop-mob-hitarea shop-mob-hitarea--address" aria-label="Find us on Google Maps"></a>
  </div>

</main>
