<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Next-generation automotive center in Calgary equipped with innovative technology, modern minimalist interior, and smart service systems.">
  <link rel="icon" type="image/svg+xml" href="assets/img/site1/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site1.css">
  <link rel="stylesheet" href="assets/css/page-service.css">
</head>
<body class="page-service">

<!-- ══ FIXED HUD HEADER ══════════════════════════════════════════════════ -->
<header class="hud" id="top">
  <a class="hud__logo" href="index.html" aria-label="AutoDNA home">
    <img src="assets/img/site1/logo.svg" width="37" height="21" alt="AutoDNA">
  </a>
  <button class="hud__burger" id="burger" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- ══ FULLSCREEN MENU OVERLAY ════════════════════════════════════════════ -->
<nav class="menu" id="menu" aria-label="Site menu" hidden>
  <div class="menu__container">
    <div class="menu__header">
      <a class="menu__logo" href="index.html" aria-label="AutoDNA">
        <img src="assets/img/site1/logo.svg" width="37" height="20" alt="AutoDNA">
      </a>
      <button class="menu__close" id="menu-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="28" height="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="menu__panel ticks">
      <span class="tick tl"></span><span class="tick tr"></span>
      <span class="tick bl"></span><span class="tick br"></span>
      <ul>
        <li><a href="index.html#home"><span>Home</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
        <li><a href="skipthedealer.html"><span>SkipTheDealer</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
        <li><a href="dnaservice.html" class="is-active"><span>AutoDNA Service</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
        <li><a href="index.html#carlears"><span>Who We Are</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
        <li><a href="index.html#value"><span>Why AutoDNA</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
        <li><a href="index.html#compare"><span>Price Comparison</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
        <li><a href="index.html#facts"><span>Facts &amp; Figures</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
        <li><a href="index.html#corporate"><span>About AutoDNA</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
        <li><a href="index.html#club"><span>DNA Auto Club</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
        <li><a href="#contact"><span>Contact</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M0 6H10M5.5 1.5L10 6L5.5 10.5"/></svg></a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="service-main">

  <!-- ══ DESKTOP SITE (Shown on screens > 768px) ════════════════════════ -->
  <div class="service-desktop-layout">
    <!-- Part 1: Top (Hero + Facility + Calgary headline) -->
    <div class="service-board service-board--top">
      <img src="assets/img/site1/service-top-clean.jpg" class="service-board__img" alt="AutoDNA Service — The Future of Service is Already Here" fetchpriority="high">
    </div>

    <!-- Part 2: Interactive Multiple Services Component (Component 8 - exactly matching user screenshot!) -->
    <div class="service-board service-board--multiview" id="multiple-services">
      <img id="service-view-img" src="assets/img/site1/service-state-shop.jpg" class="service-board__img" alt="ONE DNA. MULTIPLE SERVICES.">

      <!-- Interactive Tab Click Hitareas (switching state in place on the same page!) -->
      <button class="service-tab-btn service-tab-btn--shop is-active" data-service="shop" aria-label="Show SkipTheShop view"></button>
      <button class="service-tab-btn service-tab-btn--plan" data-service="plan" aria-label="Show DriveCarePlan view"></button>
      <button class="service-tab-btn service-tab-btn--paint" data-service="paint" aria-label="Show PaintBot view"></button>
    </div>

    <!-- Part 3: Bottom (Official Site Callout + Team Photo + CTA + Footer) -->
    <div class="service-board service-board--bottom">
      <img src="assets/img/site1/service-bottom-clean.jpg" class="service-board__img" alt="Inside the Mind of AutoDNA, Team and Contact" loading="lazy">

      <!-- Interactive Button: AutoDnaService ↗ -->
      <a href="https://autodnaservice.com" target="_blank" rel="noopener" class="service-hitarea service-hitarea--official" aria-label="Visit AutoDnaService official site"></a>

      <!-- Interactive Button: CONTACT WITH US ↗ -->
      <a href="#contact" class="service-hitarea service-hitarea--contact-btn" aria-label="Contact with us"></a>

      <!-- Interactive Footer Links -->
      <a href="tel:+14033128306" class="service-hitarea service-hitarea--phone" aria-label="Call +1 (403) 312-8306"></a>
      <a href="mailto:info@autodna.com" class="service-hitarea service-hitarea--email" aria-label="Email info@autodna.com"></a>

      <div class="service-hitarea service-hitarea--socials">
        <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook"></a>
        <a href="https://x.com" target="_blank" rel="noopener" aria-label="X (Twitter)"></a>
        <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram"></a>
      </div>

      <a href="https://maps.google.com/?q=730+2+Ave+SW+Calgary+T2P1R8+Canada" target="_blank" rel="noopener" class="service-hitarea service-hitarea--address" aria-label="Find us on Google Maps"></a>
    </div>
  </div>

  <!-- ══ MOBILE SITE (From Figma The future of service mob.png) ═════════ -->
  <div class="service-mobile-layout">
    <img src="assets/img/site1/dnaservice-mobile-clean.svg" class="service-mobile-svg" alt="AutoDNA Service Mobile" fetchpriority="high">
  </div>

</main>

<script src="assets/js/page-service.js"></script>
</body>
</html>
