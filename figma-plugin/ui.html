<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 16px;
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1a;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 32px);
  }
  h1 { margin: 0 0 6px; font-size: 14px; }
  p { margin: 0 0 12px; color: #666; }
  button {
    padding: 9px 14px;
    border: 0;
    border-radius: 6px;
    background: #2c2c34;
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #40404c; }
  button:disabled { opacity: .45; cursor: default; }
  #status { margin-top: 10px; color: #666; min-height: 18px; }
  textarea {
    flex: 1;
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    box-sizing: border-box;
    font: 11px/1.4 ui-monospace, Consolas, monospace;
    border: 1px solid #ddd;
    border-radius: 6px;
    resize: none;
  }
</style>
</head>
<body>
  <h1>Dump node tree</h1>
  <p>Select the site's frame(s) in Figma — or a SECTION folder to dump a whole site. Preview shows what will be dumped.</p>

  <div>
    <button id="run">Dump selected frame(s)</button>
  </div>

  <div id="targets" style="margin-top:8px;font-size:12px;color:#2c2c34;min-height:18px;"></div>
  <div id="status"></div>
  <textarea id="out" readonly placeholder="JSON will appear here"></textarea>
  <script>
    var run = document.getElementById('run');
    var out = document.getElementById('out');
    var status = document.getElementById('status');
    var targets = document.getElementById('targets');

    // live preview: poll what would be dumped so the user sees the site list
    // before the heavy run. Cheap — no tree walk, just names and sizes.
    function askPreview() {
      if (!run.disabled) parent.postMessage({ pluginMessage: { type: 'preview' } }, '*');
    }
    setInterval(askPreview, 1500);
    askPreview();

    run.addEventListener('click', function () {
      status.textContent = 'Reading…';
      out.value = '';
      run.disabled = true;
      parent.postMessage({ pluginMessage: { type: 'dump' } }, '*');
    });

    out.addEventListener('click', function () {
      if (!out.value) return;
      out.select();
      try { document.execCommand('copy'); } catch (_) {}
      // execCommand is deprecated and fails on huge payloads; the Clipboard
      // API is the reliable path for multi-megabyte dumps with images
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(out.value).then(function () {
          status.textContent = 'Copied ' + out.value.length + ' characters.';
        }, function () {
          status.textContent = out.value.length + ' characters. Select all + Ctrl+C to copy.';
        });
      } else {
        status.textContent = 'Selected ' + out.value.length + ' characters. Press Ctrl+C to copy.';
      }
    });

    onmessage = function (event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'progress') {
        status.textContent = msg.message;
        return;
      }
      if (msg.type === 'preview') {
        if (msg.error) { targets.textContent = ''; return; }
        var list = (msg.targets || []).map(function (t) {
          return t.name + ' [' + t.kind + ' ' + t.size + ']';
        });
        targets.textContent = list.length
          ? 'Will dump: ' + list.slice(0, 6).join(' · ') + (list.length > 6 ? ' +' + (list.length - 6) + ' more' : '')
          : 'Nothing selectable on this page.';
        return;
      }

      if (msg.type === 'error') {
        status.textContent = msg.message;
        run.disabled = false;
        return;
      }

      if (msg.type === 'result') {
        var text = JSON.stringify(msg.payload.length === 1 ? msg.payload[0] : msg.payload, null, 2);
        out.value = text;
        var mb = (text.length / 1048576).toFixed(1);
        var imgs = 0;
        msg.payload.forEach(function (f) { if (f.images) imgs += Object.keys(f.images).length; });
        status.textContent = msg.payload.length + ' frame(s), ' + mb + ' MB' +
          (imgs ? ', ' + imgs + ' image(s)' : '') + '. Click the box to copy.';
        run.disabled = false;
      }
    };
  </script>
</body>
</html>
