<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 16px;
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1a;
    background: #fff;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 32px);
  }
  h1 { margin: 0 0 6px; font-size: 14px; }
  p { margin: 0 0 12px; color: #666; }
  button {
    padding: 9px 14px;
    border: 0;
    border-radius: 6px;
    background: #2c2c34;
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #40404c; }
  button:disabled { opacity: .45; cursor: default; }
  #status { margin-top: 10px; color: #666; min-height: 18px; }
  textarea {
    flex: 1;
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    box-sizing: border-box;
    font: 11px/1.4 ui-monospace, Consolas, monospace;
    border: 1px solid #ddd;
    border-radius: 6px;
    resize: none;
  }
</style>
</head>
<body>
  <h1>Dump node tree</h1>
  <p>Select a frame in Figma, press the button, then copy the JSON into the project.</p>

  <div>
    <button id="run">Dump selected frame(s)</button>
  </div>

  <div id="status"></div>
  <textarea id="out" readonly placeholder="JSON will appear here"></textarea>

  <script>
    var run = document.getElementById('run');
    var out = document.getElementById('out');
    var status = document.getElementById('status');

    run.addEventListener('click', function () {
      status.textContent = 'Reading…';
      out.value = '';
      parent.postMessage({ pluginMessage: { type: 'dump' } }, '*');
    });

    out.addEventListener('click', function () {
      if (!out.value) return;
      out.select();
      document.execCommand('copy');
      status.textContent = 'Copied ' + out.value.length + ' characters.';
    });

    onmessage = function (event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'error') {
        status.textContent = msg.message;
        return;
      }

      if (msg.type === 'result') {
        var text = JSON.stringify(msg.payload.length === 1 ? msg.payload[0] : msg.payload, null, 2);
        out.value = text;
        status.textContent = msg.payload.length + ' frame(s), ' + text.length + ' characters. Click the box to copy.';
      }
    };
  </script>
</body>
</html>
